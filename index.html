<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Downloader v3</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f4f4f9; margin: 0; }
    .card { background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
    input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 14px; }
    button, .download-btn { display: inline-block; padding: 12px 20px; background: #fe2c55; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; text-decoration: none; box-sizing: border-box; margin-top: 10px; font-size: 15px; }
    button:hover { background: #e02648; }
    .download-btn { background: #25d366; }
    .download-btn:hover { background: #1eb857; }
    #status { margin-top: 15px; font-size: 14px; color: #333; word-break: break-word; }
  </style>
</head>
<body>

<div class="card">
  <h2>TikTok Downloader v3</h2>
  <input type="text" id="videoUrl" placeholder="Tempel URL TikTok di sini...">
  <button onclick="processLink()">Proses Link</button>
  <div id="status"></div>
</div>

<script>
  async function processLink() {
    const urlInput = document.getElementById('videoUrl').value.trim();
    const status = document.getElementById('status');
    
    if (!urlInput) {
      status.innerText = "Masukkan URL terlebih dahulu!";
      return;
    }

    status.innerText = "Sedang mengambil data video...";

    try {
      // API Utama: TikWM
      let res = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(urlInput)}&hd=1`);
      let data = await res.json();

      if (data && data.code === 0 && data.data) {
        showResult(data.data.title, data.data.hdplay || data.data.play);
        return;
      }

      // API Alternatif 1: Tiklydown
      status.innerText = "Mencoba server cadangan...";
      res = await fetch(`https://api.tiklydown.eu.org/api/download?url=${encodeURIComponent(urlInput)}`);
      data = await res.json();

      if (data && data.video && data.video.noWatermark) {
        showResult(data.title || 'TikTok Video', data.video.noWatermark);
        return;
      }

      status.innerText = "Gagal: Video tidak ditemukan atau link tidak valid.";
    } catch (error) {
      status.innerText = "Terjadi kesalahan jaringan / koneksi.";
    }
  }

  function showResult(title, downloadUrl) {
    const status = document.getElementById('status');
    status.innerHTML = `
      <p><b>${title || 'TikTok Video'}</b></p>
      <button class="download-btn" id="btnDownload">Download Video Langsung</button>
    `;

    // Event handler agar file langsung terunduh sebagai file mp4
    document.getElementById('btnDownload').onclick = function() {
      downloadDirectly(downloadUrl, (title || 'tiktok_video') + '.mp4');
    };
  }

  async function downloadDirectly(fileUrl, fileName) {
    const status = document.getElementById('status');
    const cleanFileName = fileName.replace(/[^a-zA-Z0-9.\-_]/g, '_');
    
    status.innerHTML += `<p style="font-size:12px; color:#666;" id="dl-msg">Mengunduh file ke perangkat...</p>`;

    try {
      const response = await fetch(fileUrl);
      const blob = await response.blob();
      
      const blobUrl = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.style.display = 'none';
      a.href = blobUrl;
      a.download = cleanFileName;
      
      document.body.appendChild(a);
      a.click();
      
      window.URL.revokeObjectURL(blobUrl);
      document.body.removeChild(a);

      const dlMsg = document.getElementById('dl-msg');
      if (dlMsg) dlMsg.innerText = "Download selesai!";
    } catch (err) {
      // Jika CORS melarang blob fetch direct, fallback buka tab langsung
      window.open(fileUrl, '_blank');
    }
  }
</script>

</body>
</html>
