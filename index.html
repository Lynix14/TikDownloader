<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Downloader</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f4f4f9; margin: 0; }
    .card { background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
    input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    button, .download-btn { display: inline-block; padding: 10px 20px; background: #fe2c55; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; text-decoration: none; box-sizing: border-box; margin-top: 10px; }
    button:hover, .download-btn:hover { background: #e02648; }
    #status { margin-top: 15px; font-size: 14px; color: #333; word-break: break-word; }
  </style>
</head>
<body>

<div class="card">
  <h2>TikTok Downloader</h2>
  <input type="text" id="videoUrl" placeholder="Tempel URL TikTok di sini...">
  <button onclick="processLink()">Proses Link</button>
  <div id="status"></div>
</div>

<script>
  async function processLink() {
    const url = document.getElementById('videoUrl').value;
    const status = document.getElementById('status');
    
    if (!url) {
      status.innerText = "Masukkan URL terlebih dahulu!";
      return;
    }

    status.innerText = "Sedang mengambil video...";

    try {
      const response = await fetch('https://tik-downloader-three.vercel.app/api/process-media', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fileUrl: url })
      });
      
      const data = await response.json();
      
      if (data.success && data.downloadUrl) {
        status.innerHTML = `
          <p><b>${data.title}</b></p>
          <a href="${data.downloadUrl}" target="_blank" class="download-btn">Download Video (No WM)</a>
        `;
      } else {
        status.innerText = "Gagal: " + (data.error || "Video tidak ditemukan.");
      }
    } catch (error) {
      status.innerText = "Gagal terhubung ke server backend.";
    }
  }
</script>

</body>
</html>
